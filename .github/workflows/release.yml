name: Release

# Publishes to npm when a GitHub release is published.
# Needs an NPM_TOKEN repository secret (an npm "Automation" or granular token).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Only full versions (v1.2.3) publish. The moving major tag (v1) does not.
    if: contains(github.event.release.tag_name, '.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
