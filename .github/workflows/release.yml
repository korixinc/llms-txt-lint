name: Release

# Publishes to npm when a GitHub release for a full version (v1.2.3) is published.
# Uses npm trusted publishing (OIDC): no npm token is stored in this repo.
# Provenance attestations are generated automatically.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Only full versions (v1.2.3) publish. The moving major tag (v1) does not.
    if: contains(github.event.release.tag_name, '.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm with trusted publishing support (11.5.1+)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm test
      - run: npm publish --access public
